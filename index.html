<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音乐计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="pitch-display">音调: C4</div>
            <div class="volume-indicator">音量: 80%</div>
        </div>

        <!-- 显示区域 -->
        <div class="display-area">
            <div class="current-note">准备播放</div>
            <div class="frequency-display">频率: 0Hz</div>
        </div>

        <!-- 按钮区域 -->
        <div class="button-grid">
            <!-- 第一行 -->
            <button class="calc-btn note-btn" data-note="C4" data-frequency="261.63">1<br><span>Do</span></button>
            <button class="calc-btn note-btn" data-note="D4" data-frequency="293.66">2<br><span>Re</span></button>
            <button class="calc-btn note-btn" data-note="E4" data-frequency="329.63">3<br><span>Mi</span></button>
            
            <!-- 第二行 -->
            <button class="calc-btn note-btn" data-note="F4" data-frequency="349.23">4<br><span>Fa</span></button>
            <button class="calc-btn note-btn" data-note="G4" data-frequency="392.00">5<br><span>Sol</span></button>
            <button class="calc-btn note-btn" data-note="A4" data-frequency="440.00">6<br><span>La</span></button>
            
            <!-- 第三行 -->
            <button class="calc-btn note-btn" data-note="C5" data-frequency="523.25">7<br><span>Do↑</span></button>
            <button class="calc-btn note-btn" data-note="D5" data-frequency="587.33">8<br><span>Re↑</span></button>
            <button class="calc-btn note-btn" data-note="E5" data-frequency="659.25">9<br><span>Mi↑</span></button>
            
            <!-- 功能按钮 -->
            <button class="calc-btn function-btn sharp-btn" id="sharp-btn">+<br><span>升调</span></button>
            <button class="calc-btn function-btn flat-btn" id="flat-btn">-<br><span>降调</span></button>
            <button class="calc-btn function-btn clear-btn" id="clear-btn">C<br><span>清除</span></button>
        </div>

        <!-- 底部控制栏 -->
        <div class="control-bar">
            <div class="volume-control">
                <label for="volume-slider">音量:</label>
                <input type="range" id="volume-slider" min="0" max="100" value="80">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
